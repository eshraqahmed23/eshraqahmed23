<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Northline — Lead Dashboard</title>
<meta name="description" content="Internal follow-up dashboard for Northline Heating & Air leads.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#EDF1F5; --surface-3:#E3E9F0; --line:#DDE5ED;
  --ink:#0E2233; --ink-soft:#42586C; --muted:#7C90A3;
  --brand:#0E6BA8; --brand-ink:#0A5488; --brand-deep:#0C2E44; --brand-soft:#E1EFF8;
  --ember:#EE6A1E; --ember-ink:#D5570E; --ember-soft:#FCE9DC;
  --good:#0F9D63; --good-bg:#E1F4EB; --warn:#B87500; --warn-bg:#FAEDD3;
  --bad:#D4433A; --bad-bg:#FBE7E5; --info:#2E5F9E; --info-bg:#E6EEFA;
  --shadow:0 1px 2px rgba(12,46,68,.06), 0 10px 26px -14px rgba(12,46,68,.22);
  --r:14px; --r-sm:9px;
  --sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --disp:"Archivo",var(--sans);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1520; --surface:#12212F; --surface-2:#182B3D; --surface-3:#213548; --line:#24384C;
  --ink:#E7F0F8; --ink-soft:#A5B8CB; --muted:#6A7F94;
  --brand:#3E9BD6; --brand-ink:#5BAEE3; --brand-deep:#0A1E2E; --brand-soft:#10293B;
  --ember:#F58445; --ember-ink:#FF9A63; --ember-soft:#33200F;
  --good:#33C98E; --good-bg:#0E2D21; --warn:#E4A73C; --warn-bg:#322611;
  --bad:#F0655B; --bad-bg:#331A18; --info:#6EA0EA; --info-bg:#132741;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0A1520; --surface:#12212F; --surface-2:#182B3D; --surface-3:#213548; --line:#24384C;
  --ink:#E7F0F8; --ink-soft:#A5B8CB; --muted:#6A7F94;
  --brand:#3E9BD6; --brand-ink:#5BAEE3; --brand-deep:#0A1E2E; --brand-soft:#10293B;
  --ember:#F58445; --ember-ink:#FF9A63; --ember-soft:#33200F;
  --good:#33C98E; --good-bg:#0E2D21; --warn:#E4A73C; --warn-bg:#322611;
  --bad:#F0655B; --bad-bg:#331A18; --info:#6EA0EA; --info-bg:#132741;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--disp);margin:0;letter-spacing:-.02em}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:11px clamp(14px,4vw,40px);background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--disp);font-weight:800;font-size:18px;line-height:1}
.brand small{display:block;font-family:var(--mono);font-weight:500;font-size:9.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.logomark{width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,var(--brand),var(--brand-deep));display:grid;place-items:center;flex:0 0 auto;position:relative}
.logomark svg{width:20px;height:20px;color:#fff}
.logomark::after{content:"";position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:99px;background:var(--ember);border:2px solid var(--surface)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pillnav{font-size:13px;font-weight:600;color:var(--ink-soft);text-decoration:none;padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.pillnav:hover{color:var(--ink);border-color:var(--muted)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);display:grid;place-items:center;font-size:16px}
.iconbtn:hover{color:var(--ink)}

main{max-width:1180px;margin:0 auto;padding:clamp(20px,4vw,40px) clamp(16px,4vw,40px) 72px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.head h1{font-size:clamp(24px,3vw,32px);font-weight:800}
.head p{margin:6px 0 0;color:var(--ink-soft);font-size:14px}
.health{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 22px}
.hbadge{font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);display:inline-flex;gap:6px;align-items:center}
.hbadge .d{width:7px;height:7px;border-radius:99px;background:var(--muted)}
.hbadge.live .d{background:var(--good)}
.hbadge.dry .d{background:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .lbl .dot{width:8px;height:8px;border-radius:99px}
.kpi .val{font-family:var(--disp);font-weight:900;font-size:34px;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.kpi.attn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.kpi.attn .val{color:var(--warn)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);font-weight:600;font-size:13.5px;padding:9px 14px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ember);color:#fff;border-color:transparent}
.btn.primary:hover{background:var(--ember-ink)}
.btn:disabled{opacity:.55;cursor:wait}
.spacer{margin-left:auto}
.updated{font-size:12px;color:var(--muted);font-family:var(--mono)}

.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
thead th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
tbody td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
tbody tr.lead{cursor:pointer;transition:background .12s}
tbody tr.lead:hover{background:var(--surface-2)}
.lead-name{font-weight:600;display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:8px;background:var(--surface-3);color:var(--ink-soft);display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--mono);flex:0 0 auto}
.lead-sub{font-size:12px;color:var(--muted);font-weight:400}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;text-transform:capitalize}
.pill .d{width:7px;height:7px;border-radius:99px;background:currentColor}
.pill.hot{color:var(--bad);background:var(--bad-bg)}
.pill.warm{color:var(--warn);background:var(--warn-bg)}
.pill.cold{color:var(--info);background:var(--info-bg)}
.fu{font-size:12.5px;font-family:var(--mono);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.fu.sent{color:var(--good)}.fu.due{color:var(--bad)}.fu.sched{color:var(--ink-soft)}.fu.failed{color:var(--bad)}.fu.none{color:var(--muted)}
.detail td{background:var(--surface-2);padding:0}
.detail .inner{padding:16px 18px 18px 55px;display:grid;gap:12px}
.detail .sum{font-size:13.5px;color:var(--ink-soft);line-height:1.6}
.detail .kv{display:flex;gap:22px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.detail .kv b{color:var(--ink);font-weight:600}
.detail .acts{display:flex;gap:8px;flex-wrap:wrap}
.detail .acts a{font-size:12.5px;font-weight:600;text-decoration:none;color:var(--brand);border:1px solid var(--line);border-radius:8px;padding:6px 11px;background:var(--surface)}
.detail .acts a:hover{border-color:var(--brand)}
.empty{padding:60px 24px;text-align:center;color:var(--muted)}
.empty h2{font-size:18px;color:var(--ink);margin-bottom:6px}
.empty a{color:var(--brand)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.22s;z-index:90}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:820px){.kpis{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logomark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20M5 5l14 14M19 5 5 19"/></svg></span>
    <span>Northline<small>Lead Dashboard</small></span>
  </div>
  <div class="nav-right">
    <a class="pillnav" href="index.html">← Website</a>
    <a class="pillnav" href="editor.html">Follow-up email</a>
    <button class="iconbtn" title="Toggle theme" aria-label="Toggle theme" onclick="toggleTheme()">◐</button>
  </div>
</header>

<main>
  <div class="head">
    <div>
      <h1>Lead &amp; follow-up dashboard</h1>
      <p>Every sign-up from the website, its AI summary, and the status of its 7-day follow-up.</p>
    </div>
  </div>
  <div class="health" id="health"></div>

  <div class="kpis" id="kpis"></div>

  <div class="toolbar">
    <button class="btn" id="refresh" onclick="load()">↻ Refresh</button>
    <button class="btn primary" id="sendnow" onclick="sendDue()">Send due follow-ups now</button>
    <a class="btn" href="/api/leads.csv">⇩ Download CSV</a>
    <span class="spacer"></span>
    <span class="updated" id="updated"></span>
  </div>

  <div class="tablewrap">
    <div class="tscroll">
      <table>
        <thead><tr><th>Customer</th><th>Service</th><th>Lead quality</th><th>7-day follow-up</th><th>Signed up</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
(function(){try{var t=localStorage.getItem("northline_theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
function toggleTheme(){var cur=document.documentElement.getAttribute("data-theme");var sd=matchMedia("(prefers-color-scheme:dark)").matches;var next=cur?(cur==="dark"?"light":"dark"):(sd?"light":"dark");document.documentElement.setAttribute("data-theme",next);try{localStorage.setItem("northline_theme",next);}catch(e){}}

var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
var initials=function(n){return (n||"?").trim().split(/\s+/).slice(0,2).map(function(w){return w[0];}).join("").toUpperCase()||"?";};
var fmtDate=function(iso){if(!iso)return "—";var d=new Date(iso);return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});};
var fmtWhen=function(iso){if(!iso)return "—";var d=new Date(iso);return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+", "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});};
var expanded={};
var state={contacts:[],reminders:[],health:null};

function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("show");},2400);}

async function load(){
  var btn=document.getElementById("refresh");btn.disabled=true;
  try{
    var r=await Promise.all([
      fetch("/api/contacts").then(function(x){return x.json();}),
      fetch("/api/reminders").then(function(x){return x.json();}),
      fetch("/api/health").then(function(x){return x.json();}).catch(function(){return null;})
    ]);
    state.contacts=Array.isArray(r[0])?r[0]:[];
    state.reminders=Array.isArray(r[1])?r[1]:[];
    state.health=r[2];
    render();
    document.getElementById("updated").textContent="Updated "+new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  }catch(e){
    toast("Couldn't reach the server. Is it running?");
  }finally{btn.disabled=false;}
}

function remFor(contact){
  // Match a follow-up reminder to a contact by id, falling back to email.
  return state.reminders.find(function(r){return r.contact_id===contact.id;})
      || state.reminders.filter(function(r){return r.lead_email===contact.email;}).slice(-1)[0]
      || null;
}
function fuInfo(rem){
  if(!rem)return {cls:"none",icon:"—",text:"No follow-up (duplicate)"};
  if(rem.status==="sent")return {cls:"sent",icon:"✓",text:"Sent "+fmtDate(rem.due_at)};
  if(rem.status==="failed")return {cls:"failed",icon:"⚠",text:"Send failed"};
  var due=Date.parse(rem.due_at);
  if(due<=Date.now())return {cls:"due",icon:"●",text:"Due now"};
  return {cls:"sched",icon:"↻",text:"Scheduled "+fmtDate(rem.due_at)};
}

function render(){
  var rows=document.getElementById("rows"),empty=document.getElementById("empty");
  var list=state.contacts.slice().reverse(); // newest first
  // KPIs
  var total=state.contacts.length;
  var hot=state.contacts.filter(function(c){return c.lead_quality==="hot";}).length;
  var due=state.reminders.filter(function(r){return r.status==="pending"&&Date.parse(r.due_at)<=Date.now();}).length;
  var sent=state.reminders.filter(function(r){return r.status==="sent";}).length;
  var cards=[
    {lbl:"Total leads",dot:"var(--info)",val:total,sub:total?"captured from the site":"none yet"},
    {lbl:"Hot leads",dot:"var(--bad)",val:hot,sub:hot?"ready to book soon":"—"},
    {lbl:"Follow-ups due",dot:"var(--warn)",val:due,sub:due?"ready to send":"all caught up",attn:due>0},
    {lbl:"Follow-ups sent",dot:"var(--good)",val:sent,sub:"7-day check-ins done"}
  ];
  document.getElementById("kpis").innerHTML=cards.map(function(c){return '<div class="kpi '+(c.attn?"attn":"")+'"><div class="lbl"><span class="dot" style="background:'+c.dot+'"></span>'+c.lbl+'</div><div class="val">'+c.val+'</div><div class="sub">'+esc(c.sub)+'</div></div>';}).join("");

  // Health
  if(state.health){
    var h=state.health;
    var emailLive=h.email&&h.email!=="dry-run";
    document.getElementById("health").innerHTML=''
      +'<span class="hbadge '+(emailLive?"live":"dry")+'"><span class="d"></span>Email: '+esc(h.email||"unknown")+(emailLive?"":" (logged, not sent)")+'</span>'
      +'<span class="hbadge '+(h.mockAi?"dry":"live")+'"><span class="d"></span>AI: '+(h.mockAi?"mock mode":"live (Claude)")+'</span>'
      +'<span class="hbadge"><span class="d"></span>CRM: '+esc(h.crm||"local")+'</span>';
  }

  if(!list.length){
    rows.innerHTML="";empty.hidden=false;
    empty.innerHTML='<h2>No leads yet</h2><p>Submit the form on the <a href="index.html">website</a> and it will appear here instantly.</p>';
    return;
  }
  empty.hidden=true;
  rows.innerHTML=list.map(function(c){
    var rem=remFor(c);
    var fu=fuInfo(rem);
    var q=(c.lead_quality||"warm").toLowerCase();
    var service=c.service_requested||(rem&&rem.service_requested)||"—";
    var open=expanded[c.id];
    var main='<tr class="lead" onclick="toggle(\''+c.id+'\')">'
      +'<td><div class="lead-name"><span class="avatar">'+esc(initials(c.name))+'</span><span>'+esc(c.name)+'<span class="lead-sub" style="display:block">'+esc(c.email||c.phone||"")+'</span></span></div></td>'
      +'<td>'+esc(service)+'</td>'
      +'<td><span class="pill '+q+'"><span class="d"></span>'+esc(q)+'</span></td>'
      +'<td><span class="fu '+fu.cls+'">'+fu.icon+' '+esc(fu.text)+'</span></td>'
      +'<td style="font-family:var(--mono);font-size:12.5px;color:var(--ink-soft)">'+fmtDate(c.created_at)+'</td>'
      +'</tr>';
    if(!open)return main;
    var mail="mailto:"+encodeURIComponent(c.email||"")+"?subject="+encodeURIComponent("Your "+service+" with Northline Heating & Air");
    var tel=c.phone?('<a href="tel:'+esc(c.phone)+'">Call '+esc(c.phone)+'</a>'):"";
    var detail='<tr class="detail"><td colspan="5"><div class="inner">'
      +'<div class="sum"><b>AI summary:</b> '+esc(c.summary||"—")+'</div>'
      +'<div class="kv">'
      + '<span>Source: <b>'+esc(c.source||"—")+'</b></span>'
      + (rem?'<span>Follow-up due: <b>'+fmtWhen(rem.due_at)+'</b></span>':'')
      + (rem&&rem.reason?'<span>Reason: <b>'+esc(rem.reason)+'</b></span>':'')
      + '<span>Contact: <b>'+esc(c.email||"")+(c.phone?(" · "+esc(c.phone)):"")+'</b></span>'
      +'</div>'
      +'<div class="acts"><a href="'+mail+'">✉ Email customer</a>'+tel+'</div>'
      +'</div></td></tr>';
    return main+detail;
  }).join("");
}
function toggle(id){expanded[id]=!expanded[id];render();}

async function sendDue(){
  var btn=document.getElementById("sendnow");btn.disabled=true;var old=btn.textContent;btn.textContent="Sending…";
  try{
    var res=await fetch("/api/reminders/send-now",{method:"POST"});
    var j=await res.json();
    toast((j.sent||0)+" follow-up"+((j.sent===1)?"":"s")+" sent");
    await load();
  }catch(e){toast("Couldn't send follow-ups");}
  finally{btn.disabled=false;btn.textContent=old;}
}

window.toggleTheme=toggleTheme;window.load=load;window.toggle=toggle;window.sendDue=sendDue;
load();
setInterval(load,20000);
</script>
</body>
</html>
